name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # CONTRIBUTING.md requires a DCO sign-off, and here that sign-off also carries
  # the licence-relicensing grant — so enforce it rather than just asking.
  # Plain bash so there is no third-party action in the supply chain.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Check commits are signed off
        run: |
          # Use the branch tip, not HEAD: actions/checkout resolves a PR to a
          # synthetic merge commit that carries no sign-off of its own.
          # --no-merges likewise spares a contributor's own merge commits.
          head='${{ github.event.pull_request.head.sha }}'
          base=$(git merge-base origin/${{ github.base_ref }} "$head")
          missing=$(git log --no-merges --format='%H %s' \
            --invert-grep --grep='^Signed-off-by: .\+ <.\+@.\+>$' "$base".."$head")
          if [ -n "$missing" ]; then
            echo "::error::Commits missing a Signed-off-by trailer:"
            echo "$missing"
            echo "Fix with: git commit --amend -s   (or git rebase --signoff $base)"
            exit 1
          fi
          echo "All commits signed off."

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      # Pinned: an unpinned ruff turns every upstream release into a red build.
      - run: pip install ruff==0.15.18
      - run: ruff check app/ tests/

  # The Helm chart (ADR-0025): a template error fails here, not at an install.
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.0
      - run: helm lint --strict charts/turncall-builder -f charts/turncall-builder/ci/values.yaml
      - run: helm template turncall-builder charts/turncall-builder -f charts/turncall-builder/ci/values.yaml
      - run: helm lint --strict charts/turncall-builder -f charts/turncall-builder/values-production.yaml
      - run: helm template turncall-builder charts/turncall-builder -f charts/turncall-builder/values-production.yaml
      - run: helm template turncall-builder charts/turncall-builder -f charts/turncall-builder/ci/values.yaml --set 'imagePullSecrets[0].name=ghcr' --set ingress.enabled=true

  # turncall-stack takes TurnCall's chart from a sibling checkout
  # (file://../../../turncall/charts/turncall), and kobikis/turncall is
  # private: TURNCALL_CHECKOUT_TOKEN is a fine-grained token with read-only
  # Contents on it. TurnCall's main, so a stack change that needs an unmerged
  # TurnCall chart change goes red here until that merges — the merge order.
  helm-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out TurnCall beside this repo
        env:
          TOKEN: ${{ secrets.TURNCALL_CHECKOUT_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::TURNCALL_CHECKOUT_TOKEN is not set: add a fine-grained token with read-only Contents on kobikis/turncall as a repository secret."
            exit 1
          fi
          git clone --quiet --depth 1 "https://x-access-token:${TOKEN}@github.com/kobikis/turncall.git" ../turncall
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.0
      - run: helm dependency build charts/turncall-stack
      - run: helm lint --strict charts/turncall-stack
      - run: helm template turncall charts/turncall-stack --set global.publicBaseUrl=https://turncall.example.com

  test:
    runs-on: ubuntu-latest
    services:
      # Matches the engine's image: builder migrations run against TurnCall's
      # Postgres, which needs the vector extension available.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: turncall
          POSTGRES_PASSWORD: turncall
          POSTGRES_DB: builder
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://turncall:turncall@localhost:5432/builder
      TEST_DATABASE_URL: postgresql://turncall:turncall@localhost:5432/builder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      # TEST_DATABASE_URL is what lets the real-DB migration tests run instead
      # of self-skipping; without it they pass silently without asserting.
      # `python -m pytest`, not bare `pytest`: the module form puts the working
      # directory on sys.path, which is what makes `import app` resolve without
      # installing the package.
      - run: python -m pytest -q
