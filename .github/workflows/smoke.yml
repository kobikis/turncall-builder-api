name: Setup smoke test

# Walks the documented first-run path against a real TurnCall instance.
# This exists because `make turncall-setup` was broken for every new user:
# provision-turncall.sh omitted the X-Platform-Key header the bootstrap
# endpoints require, so it died on a JSONDecodeError parsing a 401 body.
# Unit tests could not catch that — only running the script against a live
# TurnCall can.
#
# The stack below is built by hand rather than with `services:` so it matches
# the topology the Makefile assumes: containers named the way TurnCall's own
# compose names them, reachable from each other as `postgres` / `redis`. That
# lets the job invoke the documented make targets with no overrides, so the
# container names baked into the Makefile are themselves under test — the
# earlier version called provision-turncall.sh directly and never touched make.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "scripts/provision-turncall.sh"
      - "docker-compose.yml"
      - ".env.example"
      - "Makefile"
      - ".github/workflows/smoke.yml"

jobs:
  first-run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both branches of README Step 1, with the container names each one
          # produces. `setup` is the Step 2 target that must match it.
          - variant: localstack
            pg: localstack-postgres-1
            turncall: localstack-turncall-1
            setup: turncall-setup
          - variant: local
            pg: turncall-local-postgres-1
            turncall: turncall-local-turncall-1
            setup: turncall-setup-local
    name: first-run (${{ matrix.variant }})
    env:
      # Must match on both sides — the mismatch this test guards against.
      PLATFORM_API_KEY: smoke-platform-key
      TURNCALL_IMAGE: ghcr.io/kobikis/turncall:latest
      DB_URL: postgresql+asyncpg://turncall:turncall@postgres:5432/turncall
    steps:
      - uses: actions/checkout@v4

      # :latest, not a pin — this is an integration test of the contract between
      # the builder and the current engine. If a TurnCall change breaks the
      # bootstrap flow, this is where we want to hear about it.
      - name: Pull TurnCall
        run: docker pull "$TURNCALL_IMAGE"

      - name: Start postgres and redis
        run: |
          set -euo pipefail
          docker network create smoke
          docker run -d --name "${{ matrix.pg }}" --network smoke --network-alias postgres \
            -e POSTGRES_USER=turncall -e POSTGRES_PASSWORD=turncall -e POSTGRES_DB=turncall \
            pgvector/pgvector:pg16
          docker run -d --name smoke-redis --network smoke --network-alias redis redis:7-alpine
          for _ in $(seq 1 30); do
            docker exec "${{ matrix.pg }}" pg_isready -U turncall -q && exit 0
            sleep 2
          done
          echo "::error::postgres never became ready"; docker logs "${{ matrix.pg }}"; exit 1

      # Deliberately unmigrated: applying TurnCall's schema is turncall-migrate's
      # job, and that runs as part of the make target under test below.
      - name: Start TurnCall
        run: |
          set -euo pipefail
          docker run -d --name "${{ matrix.turncall }}" --network smoke -p 8090:8090 \
            -e DATABASE_URL="$DB_URL" \
            -e REDIS_URL=redis://redis:6379/0 \
            -e PLATFORM_API_KEY="$PLATFORM_API_KEY" \
            -e TURNCALL_ENV=development \
            -e STORAGE_BACKEND=local \
            "$TURNCALL_IMAGE"
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null http://localhost:8090/health && exit 0
            sleep 2
          done
          echo "::error::TurnCall never became healthy"
          docker logs "${{ matrix.turncall }}"; exit 1

      # The regression itself: unauthenticated bootstrap must be refused, and
      # the script must send the header that gets past it.
      - name: Bootstrap is gated
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8090/v1/projects \
            -H 'Content-Type: application/json' -d '{"name":"nokey"}')
          [ "$code" = "401" ] || { echo "::error::expected 401 without X-Platform-Key, got $code"; exit 1; }
          echo "unauthenticated bootstrap correctly refused ($code)"

      # README Step 2, verbatim. Both make prerequisites resolve container names
      # from Makefile defaults, so a name that doesn't exist is a real failure.
      - name: Run the documented setup
        run: |
          set -euo pipefail
          cp .env.example .env
          make ${{ matrix.setup }} 2>&1 | tee /tmp/setup.log

      # docker-migrate and turncall-migrate both swallow their exit status behind
      # `|| echo`, so make succeeding proves nothing — assert on what they said.
      # A wrong container name shows up here as the false "already exists" (its
      # stderr is silenced) and as "could not migrate" while TurnCall is up.
      - name: The migrations actually ran
        run: |
          set -euo pipefail
          cat /tmp/setup.log
          grep -q "created database 'builder'" /tmp/setup.log || {
            echo "::error::builder database was not created — is ${{ matrix.pg }} the right container?"; exit 1; }
          grep -q "TurnCall migrations applied" /tmp/setup.log || {
            echo "::error::TurnCall migrations did not run — is ${{ matrix.turncall }} the right container?"; exit 1; }
          ! grep -q "No such container" /tmp/setup.log || {
            echo "::error::make referenced a container that does not exist"; exit 1; }
          echo "both migration steps reported success"

      - name: The key was actually written
        run: |
          key=$(sed -n 's/^TURNCALL_API_KEY=//p' .env | head -n1)
          [ -n "$key" ] || { echo "::error::TURNCALL_API_KEY is empty after setup"; exit 1; }
          case "$key" in tc_*) ;; *) echo "::error::not a TurnCall key: ${key:0:8}..."; exit 1;; esac
          echo "minted ${key:0:8}..."

      # Proves the key works end to end, which is what the builder needs it for.
      - name: Create an agent with that key
        run: |
          key=$(sed -n 's/^TURNCALL_API_KEY=//p' .env | head -n1)
          code=$(curl -s -o /tmp/agent.json -w '%{http_code}' -X POST http://localhost:8090/v1/agents \
            -H "Authorization: Bearer $key" -H 'Content-Type: application/json' \
            -d '{"name":"smoke","config":{"system_prompt":"hi"}}')
          [ "$code" = "200" ] || [ "$code" = "201" ] || {
            echo "::error::agent create returned $code"; cat /tmp/agent.json; exit 1; }
          echo "agent created ($code)"

      - name: Container logs on failure
        if: failure()
        run: |
          docker logs "${{ matrix.turncall }}" || true
          docker logs "${{ matrix.pg }}" || true
          docker logs smoke-redis || true
