# A production install, as a starting point: the builder against a TurnCall
# installed with TurnCall's chart and its values-production.yaml, the console
# behind an Ingress with TLS, secrets in a Secret you manage. Copy it, replace
# every example.com and placeholder, and install:
#
#   kubectl -n builder create secret generic turncall-builder-env \
#     --from-literal=DATABASE_URL='postgresql://builder:...@db.example.com:5432/builder' \
#     --from-literal=PLATFORM_API_KEY='...'           `# = TurnCall's` \
#     --from-literal=ANTHROPIC_API_KEY='...' \
#     --from-literal=BUILDER_SESSION_SECRET='...' \
#     --from-literal=INTEGRATIONS_ENCRYPTION_KEY='...' \
#     --from-literal=GOOGLE_CLIENT_ID='...' --from-literal=GOOGLE_CLIENT_SECRET='...'
#   helm install turncall-builder charts/turncall-builder -n builder -f my-production-values.yaml
#
# The database is created on first start if the user may create databases;
# otherwise create it yourself. INTEGRATIONS_ENCRYPTION_KEY: set once, never
# rotate (.env.example). README "Kubernetes".
#
# builder-api runs every agent's backend as a Deployment in its own namespace
# (ADR-0025) — code the Builder generated, so give the builder a namespace of
# its own, not TurnCall's.

# Your registry's builds of the three images — builder-api (Dockerfile), the
# runtime every Agent Backend runs on (agent-runtime/Dockerfile) and the
# console (turncall-builder-web's Dockerfile) — pinned. None is published by
# these repos' CI. builder-api must be a build with the Kubernetes runner
# (ADR-0025; after 1.1.0).
api:
  image:
    repository: registry.example.com/turncall-builder-api
    tag: "1.2.0"
web:
  image:
    repository: registry.example.com/turncall-builder-web
    tag: "1.2.0"
agentRuntime:
  image: registry.example.com/turncall-agent-runtime:1.2.0

# Registry logins for private images, also handed to every Agent Backend.
imagePullSecrets: []
  # - name: ghcr

# TurnCall's Service, in its namespace.
turncallUrl: http://turncall.turncall.svc.cluster.local

global:
  # TurnCall's public URL (its global.publicBaseUrl): what the console shows
  # as a number's webhook.
  publicBaseUrl: https://turncall.example.com

existingSecret: turncall-builder-env

config:
  # Refuses the dev guest account (scripts.seed_guest).
  TURNCALL_ENV: production
  # The console's own URL.
  PUBLIC_BASE_URL: https://builder.example.com
  # Google login and Pipedream come back through the console's /api proxy.
  GOOGLE_REDIRECT_URI: https://builder.example.com/api/auth/google/callback
  PIPEDREAM_REDIRECT_URI: https://builder.example.com/api/integrations/callback
  PIPEDREAM_ENVIRONMENT: production
  AGENT_TIMEZONE: UTC

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # cert-manager.io/cluster-issuer: letsencrypt
  host: builder.example.com
  tls:
    - secretName: builder-tls
      hosts: [builder.example.com]
